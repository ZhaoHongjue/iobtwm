[project]
name = "iobtwm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZhaoHongjue", email = "hongjue2@illinois.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[project.scripts]
iobtwm = "iobtwm:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["cs537aiot", "datasets", "datasets_unified"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "N", "ANN"]

[tool.mypy]
strict = true
exclude = ["^cs537aiot/", "^datasets/", "^datasets_unified/"]

[[tool.mypy.overrides]]
# h5py ships no type information and there is no stub package.
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
